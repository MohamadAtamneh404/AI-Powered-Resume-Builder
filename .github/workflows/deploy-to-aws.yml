name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC — lets GitHub request temporary AWS credentials
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "314662806015"
  ECR_BACKEND_REPO: resume-builder-backend
  ECR_FRONTEND_REPO: resume-builder-frontend
  ECS_CLUSTER: resume-builder-cluster
  ECS_SERVICE: resume-builder-service
  ECS_TASK_FAMILY: resume-builder-task
  ROLE_ARN: arn:aws:iam::314662806015:role/github-actions-deploy-resume-builder

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }} -t $REGISTRY/$ECR_BACKEND_REPO:latest ./BackEnd
          docker push $REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }}
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Build, tag, and push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }} -t $REGISTRY/$ECR_FRONTEND_REPO:latest ./client
          docker push $REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Update backend image in task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}

      - name: Update frontend image in task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
